    <!-- Ersetzt app.py beim Ausliefern durch die echten Werte (Namen, Sprache,
         Einstellungen). Synchron im <head>, damit die erste Darstellung schon
         stimmt — kein Aufbauen und wieder Wegräumen. -->
    <script>window.CONSTRUCT={};</script>
    <!-- Theme vor dem ersten Bild setzen — sonst blitzt bei hellen Themes kurz
         das dunkle Matrix-Grün auf, bis das Modul geladen ist. -->
    <script>
      (function () {
        var t = ((window.CONSTRUCT || {}).settings || {}).theme
        if (t && t !== 'matrix') document.documentElement.setAttribute('data-theme', t)
        // Gespeicherte Breite der Seitenleiste — sonst springt sie beim Laden.
        try {
          var w = +localStorage.getItem('sideW')
          if (w >= 220) document.documentElement.style.setProperty('--side-w', Math.min(w, 900) + 'px')
        } catch (e) {}
      })()
    </script>

    <!-- Theme vor dem ersten Bild setzen — sonst blitzt bei hellen Themes kurz
         das dunkle Matrix-Grün auf, bis das Modul geladen ist. -->
    <script>
      (function () {
        var st = (window.CONSTRUCT || {}).settings || {}
        if (st.theme && st.theme !== 'matrix') document.documentElement.setAttribute('data-theme', st.theme)
        if (st.plasma) document.documentElement.setAttribute('data-plasma', '')
        // Gespeicherte Breite der Seitenleiste — sonst springt sie beim Laden.
        try {
          var w = +localStorage.getItem('sideW')
          if (w >= 220) document.documentElement.style.setProperty('--side-w', Math.min(w, 900) + 'px')
        } catch (e) {}
      })()
    </script>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Typen, Linter, Tests, Build
      - run: npm run check
      # Der Build liegt im Repo, damit Nutzer ohne Node.js installieren können.
      # Weicht er vom frisch gebauten ab, hat jemand vergessen, neu zu bauen.
      - name: Committed build is up to date
        run: git diff --exit-code -- ../static/next || (echo "::error::static/next is stale — run 'npm run build' in frontend/ and commit the result" && exit 1)

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall -q .
      - name: App imports
        run: python -c "import app"

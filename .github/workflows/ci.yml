name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Typen, Linter, Tests, Build
      - run: npm run check
      # Der Build liegt im Repo, damit Nutzer ohne Node.js installieren können.
      # Weicht er vom frisch gebauten ab, hat jemand vergessen, neu zu bauen.
      - name: Committed build is up to date
        run: git diff --exit-code -- ../static/app || (echo "::error::static/app is stale — run 'npm run build' in frontend/ and commit the result" && exit 1)

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Undefinierte oder überflüssige Namen — fängt beim Verschieben von Code
      # zwischen Modulen genau die Fehler, die sonst erst zur Laufzeit knallen.
      - name: Lint
        run: python -m pyflakes app.py server tests
      - name: Tests
        run: python -m pytest -q
